name: Build Target

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Run make command
        run: |
          make TARGET=a55x-A556BXXSBCYK2 ANDROID_NDK_HOME="$ANDROID_NDK_HOME"

      - name: Copy files to artifacts directory
        run: |
          mkdir -p artifacts/a55x-A556BXXSBCYK2
          cp build/a55x-A556BXXSBCYK2/* artifacts/a55x-A556BXXSBCYK2/

      - name: Calculate payload size and update targets-v3.json
        run: |
          PAYLOAD_SIZE=$(stat -c%s "artifacts/a55x-A556BXXSBCYK2/cve-2026-43499-app.so")
          echo "Calculated payload size: $PAYLOAD_SIZE bytes"
          
          jq --argjson size "$PAYLOAD_SIZE" \
            '(.payloads[] | select(.payloadId == "a55x-A556BXXSBCYK2").exploit.size) = $size' \
            support/targets-v3.json > support/targets-v3.json.tmp && mv support/targets-v3.json.tmp support/targets-v3.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a55x-A556BXXSBCYK2-payloads
          path: artifacts/

      - name: Commit and push changes back to repository
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/ support/targets-v3.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update build artifacts and payload size for a55x-A556BXXSBCYK2" && git push)
