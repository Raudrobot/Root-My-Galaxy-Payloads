name: Build Target

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Run make command
        run: |
          make TARGET=a55x-A556BXXSBCYK2 ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
